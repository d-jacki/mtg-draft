<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1">
<title>MTG Life Counter</title>
<meta name="theme-color" content="#1a1510">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Life Counter">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cinzel:wght@700;900&display=swap');

  :root {
    --bg: #110e0a;
    --bg-card: #1e1a15;
    --bg-card-alt: #2a2520;
    --border: #3a3530;
    --text: #f4f1ec;
    --text-mid: #b8b0a4;
    --text-dim: #7a7068;
    --accent: #4a8ab8;
    --accent-light: #5a9fd0;
    --green: #3a8a5c;
    --red: #c0453a;
    --warm: #c4793c;
    --purple: #8b5fbf;
    --poison: #7cb342;
    --energy: #fdd835;
    --radius: 16px;
    --radius-sm: 12px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    background: linear-gradient(180deg, #1e1a15, #16130f);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(10px);
  }
  .header h1 {
    font-family: 'Cinzel', serif;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    background: linear-gradient(135deg, #d4c5a0, #8a7a5a);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    cursor: pointer;
  }
  .header-actions {
    display: flex;
    gap: 6px;
  }
  .btn-icon {
    width: 36px;
    height: 36px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.05);
    color: var(--text-mid);
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 17px;
    transition: all 0.15s;
  }
  .btn-icon:active { background: rgba(255,255,255,0.12); transform: scale(0.9); }

  /* Setup bar */
  .setup-bar {
    display: flex;
    gap: 6px;
    padding: 8px 16px;
    background: rgba(20,17,13,0.9);
    border-bottom: 1px solid rgba(255,255,255,0.04);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .setup-bar::-webkit-scrollbar { display: none; }
  .setup-btn {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.04);
    color: var(--text-dim);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    font-family: inherit;
    transition: all 0.2s;
    letter-spacing: 0.3px;
  }
  .setup-btn.active {
    background: linear-gradient(135deg, var(--accent), #3a7aaa);
    border-color: transparent;
    color: #fff;
    box-shadow: 0 2px 12px rgba(74,138,184,0.3);
  }
  .setup-btn:active { transform: scale(0.93); }

  /* Players area */
  .players {
    display: flex;
    flex-direction: column;
    gap: 3px;
    padding: 3px;
    flex: 1;
  }

  /* Player card */
  .player-card {
    border-radius: var(--radius);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
    position: relative;
    transition: all 0.4s ease;
    box-shadow: 0 2px 15px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.06);
  }

  /* Glass shine overlay */
  .player-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(
      165deg,
      rgba(255,255,255,0.08) 0%,
      rgba(255,255,255,0.02) 30%,
      transparent 50%
    );
    pointer-events: none;
    z-index: 3;
    border-radius: var(--radius);
  }

  .player-main {
    display: flex;
    align-items: center;
    flex: 1;
    min-height: 80px;
    position: relative;
  }

  .life-btn {
    flex: 0 0 72px;
    height: 100%;
    min-height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    font-weight: 700;
    border: none;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
    position: relative;
    z-index: 2;
  }

  .life-btn.minus {
    background: rgba(0,0,0,0.25);
    color: rgba(255,255,255,0.85);
    border-radius: var(--radius) 0 0 var(--radius);
    border-right: 1px solid rgba(0,0,0,0.15);
  }
  .life-btn.minus:active { background: rgba(0,0,0,0.45); transform: scale(0.96); }

  .life-btn.plus {
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.85);
    border-radius: 0 var(--radius) var(--radius) 0;
    border-left: 1px solid rgba(255,255,255,0.05);
  }
  .life-btn.plus:active { background: rgba(255,255,255,0.18); transform: scale(0.96); }

  .player-center {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 8px 4px;
    gap: 1px;
    min-width: 0;
    position: relative;
    z-index: 2;
  }

  .player-name {
    font-size: 12px;
    font-weight: 700;
    color: rgba(255,255,255,0.55);
    cursor: pointer;
    text-align: center;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    padding: 2px 10px;
    border-radius: 6px;
    border: 1px solid transparent;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-family: 'Cinzel', serif;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }
  .player-name:active { border-color: rgba(255,255,255,0.15); }

  .life-total {
    font-size: 52px;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -2px;
    color: #fff;
    text-shadow: 0 0 30px rgba(255,255,255,0.15), 0 2px 8px rgba(0,0,0,0.5);
    transition: text-shadow 0.4s;
  }
  .life-total.glow-green { text-shadow: 0 0 40px rgba(80,200,120,0.3), 0 2px 8px rgba(0,0,0,0.5); }
  .life-total.glow-yellow { text-shadow: 0 0 40px rgba(220,180,50,0.3), 0 2px 8px rgba(0,0,0,0.5); }
  .life-total.glow-red { text-shadow: 0 0 40px rgba(220,80,60,0.4), 0 2px 8px rgba(0,0,0,0.5); }
  .life-total.glow-blue { text-shadow: 0 0 40px rgba(80,160,240,0.3), 0 2px 8px rgba(0,0,0,0.5); }
  .life-total.danger { animation: pulse 1s infinite; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .life-delta {
    font-size: 15px;
    font-weight: 700;
    min-height: 20px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }
  .life-delta.pos { color: #80ffaa; }
  .life-delta.neg { color: #ff8888; }

  /* Counters row */
  .counters-row {
    display: flex;
    gap: 1px;
    background: rgba(0,0,0,0.3);
    border-top: 1px solid rgba(0,0,0,0.2);
    position: relative;
    z-index: 2;
  }

  .counter {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    padding: 5px 2px;
    background: rgba(0,0,0,0.12);
    min-height: 34px;
  }

  .counter-icon {
    font-size: 13px;
    flex-shrink: 0;
    opacity: 0.8;
  }

  .counter-val {
    font-size: 14px;
    font-weight: 700;
    min-width: 16px;
    text-align: center;
  }

  .counter-btn {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(0,0,0,0.25);
    color: rgba(255,255,255,0.6);
    font-size: 15px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-family: inherit;
    line-height: 1;
    padding: 0;
    transition: all 0.1s;
  }
  .counter-btn:active { background: rgba(255,255,255,0.15); transform: scale(0.85); }

  .counter.poison .counter-val { color: var(--poison); text-shadow: 0 0 8px rgba(124,179,66,0.4); }
  .counter.energy .counter-val { color: var(--energy); text-shadow: 0 0 8px rgba(253,216,53,0.4); }
  .counter.experience .counter-val { color: var(--purple); text-shadow: 0 0 8px rgba(139,95,191,0.4); }
  .counter.rad .counter-val { color: var(--warm); text-shadow: 0 0 8px rgba(196,121,60,0.4); }

  /* History panel */
  .history-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 200;
    display: none;
    opacity: 0;
    transition: opacity 0.2s;
    backdrop-filter: blur(4px);
  }
  .history-overlay.open { display: block; opacity: 1; }

  .history-panel {
    position: fixed;
    right: 0; top: 0; bottom: 0;
    width: min(320px, 85vw);
    background: linear-gradient(180deg, #1e1a15, #14110d);
    z-index: 201;
    display: flex;
    flex-direction: column;
    transform: translateX(100%);
    transition: transform 0.25s ease-out;
    border-left: 1px solid rgba(255,255,255,0.06);
  }
  .history-overlay.open .history-panel { transform: translateX(0); }

  .history-header {
    padding: 16px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .history-header h2 { font-size: 16px; font-weight: 700; }

  .history-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }
  .history-item {
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 13px;
    color: var(--text-mid);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .history-item:nth-child(odd) { background: rgba(255,255,255,0.03); }
  .history-item .h-change.pos { color: #80ffaa; font-weight: 700; }
  .history-item .h-change.neg { color: #ff8888; font-weight: 700; }
  .history-empty {
    text-align: center;
    color: var(--text-dim);
    padding: 32px 16px;
    font-size: 14px;
  }

  /* Modals */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 300;
    display: none;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: linear-gradient(180deg, #252018, #1a1610);
    border-radius: var(--radius);
    padding: 24px;
    width: min(320px, 90vw);
    text-align: center;
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  .modal h3 {
    margin-bottom: 8px;
    font-size: 18px;
    font-family: 'Cinzel', serif;
  }
  .modal p { color: var(--text-mid); font-size: 14px; margin-bottom: 20px; }
  .modal-actions {
    display: flex;
    gap: 10px;
  }
  .modal-btn {
    flex: 1;
    padding: 12px;
    border-radius: var(--radius-sm);
    border: none;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }
  .modal-btn.cancel {
    background: rgba(255,255,255,0.06);
    color: var(--text-mid);
    border: 1px solid rgba(255,255,255,0.08);
  }
  .modal-btn.confirm {
    background: linear-gradient(135deg, #c0453a, #a03a30);
    color: #fff;
    box-shadow: 0 4px 15px rgba(192,69,58,0.3);
  }
  .modal-btn.accent {
    background: linear-gradient(135deg, var(--accent), #3a7aaa);
    color: #fff;
    box-shadow: 0 4px 15px rgba(74,138,184,0.3);
  }
  .modal-btn:active { transform: scale(0.95); }

  /* Dice modal */
  .dice-area {
    padding: 16px 0;
  }
  .dice-result {
    font-size: 80px;
    font-weight: 900;
    font-family: 'Cinzel', serif;
    min-height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
    letter-spacing: -2px;
    background: linear-gradient(135deg, #d4c5a0, #8a7a5a);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5));
  }
  .dice-result.rolling {
    animation: diceRoll 0.08s infinite;
    background: linear-gradient(135deg, #fff, #ccc);
    -webkit-background-clip: text;
    background-clip: text;
  }
  @keyframes diceRoll {
    0% { transform: rotate(-8deg) scale(1.08); }
    50% { transform: rotate(8deg) scale(0.92); }
    100% { transform: rotate(-8deg) scale(1.08); }
  }
  .dice-winner {
    font-size: 14px;
    color: var(--accent-light);
    margin-top: 8px;
    min-height: 20px;
    font-weight: 600;
  }
  .dice-players {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
    margin-top: 12px;
  }
  .dice-player-result {
    padding: 6px 12px;
    border-radius: 8px;
    background: rgba(255,255,255,0.04);
    font-size: 13px;
    font-weight: 600;
    border: 2px solid transparent;
    transition: all 0.3s;
  }
  .dice-player-result.winner {
    border-color: var(--accent-light);
    background: rgba(74,138,184,0.15);
    box-shadow: 0 0 15px rgba(74,138,184,0.2);
  }

  /* Wake lock indicator */
  .wake-lock-indicator {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-dim);
    transition: all 0.3s;
  }
  .wake-lock-indicator.active {
    background: #50e880;
    box-shadow: 0 0 8px #50e880, 0 0 16px rgba(80,232,128,0.3);
  }

  /* 2 players layout */
  .players.p2 .player-card { min-height: calc(50dvh - 50px); }
  .players.p2 .life-total { font-size: 72px; }
  .players.p2 .life-btn { flex: 0 0 90px; min-height: 100px; font-size: 36px; }

  /* 3-4 players */
  .players.p3 .player-card,
  .players.p4 .player-card { min-height: unset; }
  .players.p3 .life-total,
  .players.p4 .life-total { font-size: 44px; }

  @media (min-width: 500px) {
    .players.p4 {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }
  }

  html { overscroll-behavior: none; }

  /* Commander damage */
  .cmdr-toggle {
    font-size: 11px;
    color: rgba(255,255,255,0.4);
    text-align: center;
    padding: 3px;
    cursor: pointer;
    border-top: 1px solid rgba(0,0,0,0.2);
    position: relative;
    z-index: 2;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    font-weight: 600;
  }
  .cmdr-toggle:active { color: rgba(255,255,255,0.6); }

  .cmdr-damage {
    display: none;
    flex-wrap: wrap;
    gap: 1px;
    background: rgba(0,0,0,0.3);
    border-top: 1px solid rgba(0,0,0,0.2);
    position: relative;
    z-index: 2;
  }
  .cmdr-damage.open { display: flex; }

  .cmdr-damage-item {
    flex: 1 1 calc(33.3% - 1px);
    min-width: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 5px;
    background: rgba(0,0,0,0.1);
    font-size: 12px;
  }
  .cmdr-damage-item .cmdr-from {
    color: rgba(255,255,255,0.4);
    font-weight: 600;
    max-width: 50px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 11px;
  }
  .cmdr-damage-item .counter-val { font-size: 14px; color: var(--warm); text-shadow: 0 0 8px rgba(196,121,60,0.4); }

  /* Swipe hint */
  .swipe-hint {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 11px;
    color: rgba(255,255,255,0);
    pointer-events: none;
    z-index: 5;
    font-weight: 700;
    transition: all 0.3s;
  }
  .swipe-hint.left { left: 80px; }
  .swipe-hint.right { right: 80px; }
  .player-card.swiping-left .swipe-hint.left { color: rgba(255,100,100,0.7); }
  .player-card.swiping-right .swipe-hint.right { color: rgba(100,255,150,0.7); }
</style>
</head>
<body>

<div class="header">
  <h1 id="titleEl">Life Counter</h1>
  <div class="header-actions">
    <button class="btn-icon" onclick="openDice()" title="Dado">&#x1f3b2;</button>
    <button class="btn-icon" onclick="toggleWakeLock()" title="Schermo acceso">
      <div class="wake-lock-indicator" id="wakeLockDot"></div>
    </button>
    <button class="btn-icon" onclick="openHistory()" title="Cronologia">&#x1f4cb;</button>
    <button class="btn-icon" onclick="confirmReset()" title="Reset">&#x21bb;</button>
  </div>
</div>

<div class="setup-bar">
  <button class="setup-btn" onclick="setPlayers(2)" data-players="2">2 Giocatori</button>
  <button class="setup-btn" onclick="setPlayers(3)" data-players="3">3 Giocatori</button>
  <button class="setup-btn" onclick="setPlayers(4)" data-players="4">4 Giocatori</button>
  <span style="width:1px;background:rgba(255,255,255,0.06);margin:2px 4px"></span>
  <button class="setup-btn" onclick="setStartLife(20)" data-life="20">20 LP</button>
  <button class="setup-btn" onclick="setStartLife(40)" data-life="40">40 LP</button>
</div>

<div class="players" id="playersArea"></div>

<!-- History panel -->
<div class="history-overlay" id="historyOverlay" onclick="closeHistory()">
  <div class="history-panel" onclick="event.stopPropagation()">
    <div class="history-header">
      <h2>Cronologia</h2>
      <button class="btn-icon" onclick="closeHistory()">&times;</button>
    </div>
    <div class="history-list" id="historyList"></div>
  </div>
</div>

<!-- Reset modal -->
<div class="modal-overlay" id="resetModal">
  <div class="modal">
    <h3>Nuova partita?</h3>
    <p>Tutti i punti vita e segnalini verranno azzerati.</p>
    <div class="modal-actions">
      <button class="modal-btn cancel" onclick="closeReset()">Annulla</button>
      <button class="modal-btn confirm" onclick="doReset()">Reset</button>
    </div>
  </div>
</div>

<!-- Dice modal -->
<div class="modal-overlay" id="diceModal">
  <div class="modal">
    <h3>Tira il D20</h3>
    <p>Chi inizia la partita?</p>
    <div class="dice-area">
      <div class="dice-result" id="diceResult">--</div>
      <div class="dice-winner" id="diceWinner"></div>
      <div class="dice-players" id="dicePlayers"></div>
    </div>
    <div class="modal-actions">
      <button class="modal-btn cancel" onclick="closeDice()">Chiudi</button>
      <button class="modal-btn accent" onclick="rollDice()">Tira!</button>
    </div>
  </div>
</div>

<script>
const DEFAULT_NAMES = ['Giocatore 1','Giocatore 2','Giocatore 3','Giocatore 4'];

let state = {
  numPlayers: 2,
  startLife: 20,
  players: [],
  history: []
};

// === SECRET DICE MODE (double-tap title to toggle) ===
let luckyMode = false;
let titleTaps = 0;
let titleTapTimer = null;
document.getElementById('titleEl').addEventListener('click', () => {
  titleTaps++;
  clearTimeout(titleTapTimer);
  titleTapTimer = setTimeout(() => { titleTaps = 0; }, 400);
  if (titleTaps === 2) {
    luckyMode = !luckyMode;
    titleTaps = 0;
    // Subtle 2-pulse vibration as only feedback
    vibrate(luckyMode ? [15, 80, 15] : [10]);
  }
});

// === LIFE COLOR GRADIENT ===
function getLifeColor(life, startLife) {
  const ratio = life / startLife;

  if (life <= 0) {
    return { bg: 'linear-gradient(135deg, #2a0a0a, #1a0505)', glow: 'glow-red', border: '#5a1515' };
  }

  if (ratio >= 1.5) {
    return { bg: 'linear-gradient(135deg, #0d2a45, #152840)', glow: 'glow-blue', border: '#2a5580' };
  }

  if (ratio > 1) {
    const t = Math.min((ratio - 1) / 0.5, 1);
    const r1 = Math.round(lerp(30, 13, t));
    const g1 = Math.round(lerp(65, 42, t));
    const b1 = Math.round(lerp(40, 69, t));
    const r2 = Math.round(lerp(20, 21, t));
    const g2 = Math.round(lerp(50, 40, t));
    const b2 = Math.round(lerp(30, 64, t));
    return {
      bg: `linear-gradient(135deg, rgb(${r1},${g1},${b1}), rgb(${r2},${g2},${b2}))`,
      glow: t > 0.5 ? 'glow-blue' : 'glow-green',
      border: `rgb(${r1+30},${g1+30},${b1+30})`
    };
  }

  let r1, g1, b1, r2, g2, b2, glow;
  if (ratio > 0.5) {
    const t = (ratio - 0.5) / 0.5;
    r1 = Math.round(lerp(90, 30, t));  g1 = Math.round(lerp(60, 65, t));  b1 = Math.round(lerp(15, 40, t));
    r2 = Math.round(lerp(70, 20, t));  g2 = Math.round(lerp(45, 50, t));  b2 = Math.round(lerp(10, 30, t));
    glow = t > 0.5 ? 'glow-green' : 'glow-yellow';
  } else if (ratio > 0.25) {
    const t = (ratio - 0.25) / 0.25;
    r1 = Math.round(lerp(110, 90, t));  g1 = Math.round(lerp(35, 60, t));  b1 = Math.round(lerp(12, 15, t));
    r2 = Math.round(lerp(85, 70, t));   g2 = Math.round(lerp(25, 45, t));  b2 = Math.round(lerp(10, 10, t));
    glow = 'glow-yellow';
  } else {
    const t = Math.max(ratio / 0.25, 0);
    r1 = Math.round(lerp(70, 110, t));  g1 = Math.round(lerp(12, 35, t));  b1 = Math.round(lerp(12, 12, t));
    r2 = Math.round(lerp(45, 85, t));   g2 = Math.round(lerp(8, 25, t));   b2 = Math.round(lerp(8, 10, t));
    glow = 'glow-red';
  }

  return {
    bg: `linear-gradient(135deg, rgb(${r1},${g1},${b1}), rgb(${r2},${g2},${b2}))`,
    glow: glow,
    border: `rgb(${Math.min(r1+40,255)},${Math.min(g1+40,255)},${Math.min(b1+40,255)})`
  };
}

function lerp(a, b, t) { return a + (b - a) * t; }

// === HAPTIC FEEDBACK ===
function vibrate(ms) {
  if (navigator.vibrate) navigator.vibrate(ms || 15);
}

// === WAKE LOCK ===
let wakeLock = null;

async function toggleWakeLock() {
  vibrate(15);
  if (wakeLock) {
    await wakeLock.release();
    wakeLock = null;
    document.getElementById('wakeLockDot').classList.remove('active');
  } else {
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      document.getElementById('wakeLockDot').classList.add('active');
      wakeLock.addEventListener('release', () => {
        wakeLock = null;
        document.getElementById('wakeLockDot').classList.remove('active');
      });
    } catch(e) {}
  }
}

document.addEventListener('visibilitychange', async () => {
  if (wakeLock !== null && document.visibilityState === 'visible') {
    try { wakeLock = await navigator.wakeLock.request('screen'); } catch(e) {}
  }
});

// === PLAYERS ===
function initPlayers() {
  state.players = [];
  for (let i = 0; i < state.numPlayers; i++) {
    state.players.push({
      name: DEFAULT_NAMES[i],
      life: state.startLife,
      poison: 0, energy: 0, experience: 0, rad: 0,
      cmdrDamage: {}, cmdrOpen: false
    });
  }
  state.history = [];
  render();
}

function setPlayers(n) { vibrate(15); state.numPlayers = n; initPlayers(); updateSetupBtns(); }
function setStartLife(lp) { vibrate(15); state.startLife = lp; initPlayers(); updateSetupBtns(); }

function updateSetupBtns() {
  document.querySelectorAll('[data-players]').forEach(b => b.classList.toggle('active', +b.dataset.players === state.numPlayers));
  document.querySelectorAll('[data-life]').forEach(b => b.classList.toggle('active', +b.dataset.life === state.startLife));
}

function changeLife(idx, delta) {
  vibrate(Math.abs(delta) <= 1 ? 10 : 25);
  const p = state.players[idx];
  p.life += delta;
  state.history.unshift({ player: p.name, type: 'life', delta, newVal: p.life, time: new Date() });
  showDelta(idx, delta);
  render();
  saveState();
}

function changeCounter(idx, counter, delta) {
  vibrate(10);
  const p = state.players[idx];
  p[counter] = Math.max(0, p[counter] + delta);
  state.history.unshift({ player: p.name, type: counter, delta, newVal: p[counter], time: new Date() });
  render();
  saveState();
}

function changeCmdrDamage(toIdx, fromIdx, delta) {
  vibrate(10);
  const p = state.players[toIdx];
  if (!p.cmdrDamage[fromIdx]) p.cmdrDamage[fromIdx] = 0;
  p.cmdrDamage[fromIdx] = Math.max(0, p.cmdrDamage[fromIdx] + delta);
  render();
  saveState();
}

function toggleCmdr(idx) { vibrate(10); state.players[idx].cmdrOpen = !state.players[idx].cmdrOpen; render(); }

let deltaTimers = {};
let deltaAccum = {};

function showDelta(idx, delta) {
  if (!deltaAccum[idx]) deltaAccum[idx] = 0;
  deltaAccum[idx] += delta;
  clearTimeout(deltaTimers[idx]);
  const el = document.getElementById(`delta-${idx}`);
  if (el) {
    const v = deltaAccum[idx];
    el.textContent = (v > 0 ? '+' : '') + v;
    el.className = 'life-delta ' + (v > 0 ? 'pos' : v < 0 ? 'neg' : '');
  }
  deltaTimers[idx] = setTimeout(() => {
    const el = document.getElementById(`delta-${idx}`);
    if (el) { el.textContent = ''; el.className = 'life-delta'; }
    deltaAccum[idx] = 0;
  }, 1500);
}

function renamePl(idx) {
  vibrate(10);
  const name = prompt('Nome giocatore:', state.players[idx].name);
  if (name && name.trim()) { state.players[idx].name = name.trim(); render(); saveState(); }
}

function render() {
  const area = document.getElementById('playersArea');
  area.className = 'players p' + state.numPlayers;
  const isCommander = state.startLife === 40;

  area.innerHTML = state.players.map((p, i) => {
    const lifeClass = p.life <= 0 ? 'danger' : '';
    const colors = getLifeColor(p.life, state.startLife);

    let cmdrHtml = '';
    if (isCommander) {
      const others = state.players.map((op, oi) => ({ name: op.name, idx: oi })).filter(o => o.idx !== i);
      cmdrHtml = `
        <div class="cmdr-toggle" onclick="toggleCmdr(${i})">
          ${p.cmdrOpen ? '&#9650;' : '&#9660;'} Commander Damage
        </div>
        <div class="cmdr-damage ${p.cmdrOpen ? 'open' : ''}">
          ${others.map(o => `
            <div class="cmdr-damage-item">
              <button class="counter-btn" onclick="changeCmdrDamage(${i},${o.idx},-1)">&minus;</button>
              <span class="cmdr-from">${o.name.substring(0,6)}</span>
              <span class="counter-val">${p.cmdrDamage[o.idx] || 0}</span>
              <button class="counter-btn" onclick="changeCmdrDamage(${i},${o.idx},+1)">+</button>
            </div>
          `).join('')}
        </div>
      `;
    }

    return `
      <div class="player-card" style="background:${colors.bg}; border-left: 3px solid ${colors.border}" data-idx="${i}">
        <div class="player-main">
          <button class="life-btn minus" onclick="changeLife(${i},-1)" ontouchstart="" aria-label="Meno vita">&minus;</button>
          <div class="player-center">
            <div class="player-name" onclick="renamePl(${i})">${p.name}</div>
            <div class="life-total ${colors.glow} ${lifeClass}">${p.life}</div>
            <div class="life-delta" id="delta-${i}"></div>
          </div>
          <button class="life-btn plus" onclick="changeLife(${i},+1)" ontouchstart="" aria-label="Più vita">+</button>
        </div>
        <div class="counters-row">
          <div class="counter poison">
            <button class="counter-btn" onclick="changeCounter(${i},'poison',-1)">&minus;</button>
            <span class="counter-icon">&#x2620;</span>
            <span class="counter-val">${p.poison}</span>
            <button class="counter-btn" onclick="changeCounter(${i},'poison',+1)">+</button>
          </div>
          <div class="counter energy">
            <button class="counter-btn" onclick="changeCounter(${i},'energy',-1)">&minus;</button>
            <span class="counter-icon">&#x26a1;</span>
            <span class="counter-val">${p.energy}</span>
            <button class="counter-btn" onclick="changeCounter(${i},'energy',+1)">+</button>
          </div>
          <div class="counter experience">
            <button class="counter-btn" onclick="changeCounter(${i},'experience',-1)">&minus;</button>
            <span class="counter-icon">&#x2b50;</span>
            <span class="counter-val">${p.experience}</span>
            <button class="counter-btn" onclick="changeCounter(${i},'experience',+1)">+</button>
          </div>
          <div class="counter rad">
            <button class="counter-btn" onclick="changeCounter(${i},'rad',-1)">&minus;</button>
            <span class="counter-icon">&#x2622;</span>
            <span class="counter-val">${p.rad}</span>
            <button class="counter-btn" onclick="changeCounter(${i},'rad',+1)">+</button>
          </div>
        </div>
        ${cmdrHtml}
      </div>
    `;
  }).join('');
}

// === DICE ===
let diceRolling = false;
let diceInterval = null;

function openDice() {
  vibrate(15);
  document.getElementById('diceResult').textContent = '--';
  document.getElementById('diceResult').classList.remove('rolling');
  document.getElementById('diceWinner').textContent = '';
  document.getElementById('dicePlayers').innerHTML = '';
  document.getElementById('diceModal').classList.add('open');
}

function closeDice() {
  if (diceInterval) { clearInterval(diceInterval); diceInterval = null; }
  diceRolling = false;
  document.getElementById('diceModal').classList.remove('open');
}

function rollDice() {
  if (diceRolling) return;
  diceRolling = true;
  vibrate(30);

  const resultEl = document.getElementById('diceResult');
  const winnerEl = document.getElementById('diceWinner');
  const playersEl = document.getElementById('dicePlayers');
  resultEl.classList.add('rolling');
  winnerEl.textContent = '';
  playersEl.innerHTML = '';

  let rollCount = 0;
  const totalRolls = 18;

  diceInterval = setInterval(() => {
    rollCount++;
    resultEl.textContent = Math.floor(Math.random() * 20) + 1;

    if (rollCount >= totalRolls) {
      clearInterval(diceInterval);
      diceInterval = null;
      diceRolling = false;
      resultEl.classList.remove('rolling');

      // Roll for each player
      const playerRolls = state.players.map((p, i) => {
        let r = Math.floor(Math.random() * 20) + 1;
        return { name: p.name, roll: r, idx: i };
      });

      // Lucky mode: ensure player 0 wins
      if (luckyMode) {
        const maxOther = Math.max(...playerRolls.filter(pr => pr.idx !== 0).map(pr => pr.roll));
        if (playerRolls[0].roll <= maxOther) {
          playerRolls[0].roll = Math.min(maxOther + Math.floor(Math.random() * 3) + 1, 20);
          // If all others are 20, at least tie (re-roll shows first player wins ties)
          if (playerRolls[0].roll <= maxOther) playerRolls[0].roll = 20;
        }
      }

      let maxRoll = 0;
      let winnerId = 0;
      playerRolls.forEach(pr => {
        if (pr.roll > maxRoll) { maxRoll = pr.roll; winnerId = pr.idx; }
      });

      resultEl.textContent = maxRoll;
      winnerEl.textContent = `${state.players[winnerId].name} inizia!`;
      vibrate([30, 50, 30]);

      playersEl.innerHTML = playerRolls.map(pr =>
        `<div class="dice-player-result ${pr.idx === winnerId ? 'winner' : ''}">
          ${pr.name}: ${pr.roll}
        </div>`
      ).join('');
    }
  }, 70);
}

// === HISTORY ===
function openHistory() {
  vibrate(15);
  const list = document.getElementById('historyList');
  if (state.history.length === 0) {
    list.innerHTML = '<div class="history-empty">Nessuna modifica ancora</div>';
  } else {
    const labels = { life: 'LP', poison: '&#x2620;', energy: '&#x26a1;', experience: '&#x2b50;', rad: '&#x2622;' };
    list.innerHTML = state.history.slice(0, 100).map(h => {
      const sign = h.delta > 0 ? 'pos' : 'neg';
      const prefix = h.delta > 0 ? '+' : '';
      return `<div class="history-item">
        <span>${h.player} &middot; ${labels[h.type] || h.type}</span>
        <span class="h-change ${sign}">${prefix}${h.delta} &rarr; ${h.newVal}</span>
      </div>`;
    }).join('');
  }
  document.getElementById('historyOverlay').classList.add('open');
}

function closeHistory() { document.getElementById('historyOverlay').classList.remove('open'); }

// === RESET ===
function confirmReset() { vibrate(15); document.getElementById('resetModal').classList.add('open'); }
function closeReset() { document.getElementById('resetModal').classList.remove('open'); }
function doReset() { vibrate(30); closeReset(); initPlayers(); saveState(); }

// === PERSISTENCE ===
function saveState() {
  try {
    localStorage.setItem('mtg-life-state', JSON.stringify({
      numPlayers: state.numPlayers, startLife: state.startLife, players: state.players
    }));
  } catch(e) {}
}

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem('mtg-life-state'));
    if (s && s.players && s.players.length) {
      state.numPlayers = s.numPlayers; state.startLife = s.startLife;
      state.players = s.players; state.history = [];
      render(); updateSetupBtns(); return true;
    }
  } catch(e) {}
  return false;
}

// === LONG PRESS for +5/-5 ===
let longPressTimer = null;
document.addEventListener('pointerdown', (e) => {
  const btn = e.target.closest('.life-btn');
  if (!btn) return;
  longPressTimer = setTimeout(() => {
    const isMinus = btn.classList.contains('minus');
    const match = btn.getAttribute('onclick').match(/changeLife\((\d+),/);
    if (match) changeLife(+match[1], isMinus ? -5 : 5);
    longPressTimer = null;
  }, 500);
});
document.addEventListener('pointerup', () => { if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; } });
document.addEventListener('pointercancel', () => { if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; } });

// === SWIPE on life total for +10/-10 ===
let swipeStartX = null;
let swipePlayerIdx = null;

document.addEventListener('touchstart', (e) => {
  const center = e.target.closest('.player-center');
  if (!center) return;
  const card = center.closest('.player-card');
  if (!card) return;
  swipePlayerIdx = +card.dataset.idx;
  swipeStartX = e.touches[0].clientX;
}, { passive: true });

document.addEventListener('touchend', (e) => {
  if (swipeStartX === null || swipePlayerIdx === null) return;
  const diff = e.changedTouches[0].clientX - swipeStartX;
  if (Math.abs(diff) > 60) changeLife(swipePlayerIdx, diff > 0 ? 10 : -10);
  swipeStartX = null; swipePlayerIdx = null;
});

// Prevent zoom on double-tap
let lastTouchEnd = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) e.preventDefault();
  lastTouchEnd = now;
}, false);

// === INIT ===
if (!loadState()) initPlayers();
updateSetupBtns();

// === SERVICE WORKER ===
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js');
}
</script>
