<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MTG Draft Swiss</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3d6b8e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MTG Draft">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="header">
  <h1>MTG Draft</h1>
  <div class="header-sub" id="headerSub">Nuovo torneo</div>
</div>

<div class="nav">
  <button class="nav-btn active" data-tab="setup"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Setup</button>
  <button class="nav-btn" data-tab="draft"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5"/></svg>Tavolo</button>
  <button class="nav-btn" data-tab="round"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Round</button>
  <button class="nav-btn" data-tab="standings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg>Classifica</button>
  <button class="nav-btn" data-tab="league"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M17 5h3v2a3 3 0 0 1-3 3"/><path d="M7 5H4v2a3 3 0 0 0 3 3"/></svg>Lega</button>
</div>

<div class="status hidden" id="statusBar"></div>

<!-- SETUP -->
<div class="screen active" id="screen-setup">
  <div id="liveBanner"></div>
  <div class="card">
    <div class="card-title">Giocatori</div>
    <div style="display:flex;gap:8px;" id="addPlayerRow">
      <input type="text" id="playerInput" placeholder="Nome giocatore" autocomplete="off" maxlength="40" aria-label="Nome giocatore" />
      <button class="btn btn-primary btn-sm btn-add" onclick="addPlayer()" aria-label="Aggiungi giocatore">+</button>
    </div>
    <div id="rosterChips"></div>
    <div id="playerList" class="mt"></div>
    <div class="mt text-sm text-dim" id="playerCount">0 giocatori</div>
  </div>
  <button class="btn btn-primary mt" id="goToSeatingBtn" onclick="goToSeating()" disabled>Disposizione al tavolo →</button>
</div>

<!-- DRAFT -->
<div class="screen" id="screen-draft">
  <div class="card">
    <div class="flex-between mb">
      <div class="card-title" style="margin:0;">Ordine al tavolo</div>
      <button class="btn btn-secondary btn-sm" id="reshuffleBtn" onclick="reshuffleDraft()">Rimescola</button>
    </div>
    <div class="text-xs text-dim mb" id="seatHint">Usa le frecce per spostare i giocatori. Al round 1 si scontrano i lati opposti.</div>
    <div id="seatList"></div>
  </div>
  <div class="card" style="overflow:visible;">
    <div class="card-title">Vista tavolo</div>
    <div id="draftVisual"></div>
  </div>
  <div class="card">
    <div class="card-title" id="previewTitle">Accoppiamenti Round 1</div>
    <div id="pairingPreview"></div>
  </div>
  <button class="btn btn-primary mt" id="startBtn" onclick="handleStart()">Inizia torneo</button>
</div>

<!-- ROUND -->
<div class="screen" id="screen-round">
  <div id="roundContent" class="swipe-area"></div>
</div>

<!-- STANDINGS -->
<div class="screen" id="screen-standings">
  <div id="standingsContent"></div>
</div>

<!-- LEGA -->
<div class="screen" id="screen-league">
  <div id="leagueContent"></div>
  <input type="file" id="importFile" accept="application/json,.json" class="hidden" onchange="importLeagueFile(this)">
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalText">
    <h3 id="modalTitle"></h3>
    <p id="modalText"></p>
    <div id="modalBody"></div>
    <div class="btn-row" id="modalButtons">
      <button class="btn btn-secondary btn-sm" onclick="closeModal()">Annulla</button>
      <button class="btn btn-danger btn-sm" id="modalConfirm">Conferma</button>
    </div>
  </div>
</div>

<!-- ANNOUNCE PAIRINGS -->
<div class="announce-overlay" id="announceOverlay" role="dialog" aria-modal="true" aria-label="Annuncio accoppiamenti">
  <div id="announceContent"></div>
  <div class="announce-actions">
    <button class="btn btn-sm" onclick="copyPairings()">📋 Copia</button>
    <button class="btn btn-sm" onclick="closeAnnounce()">Chiudi</button>
  </div>
</div>

<!-- UPDATE BANNER -->
<div class="update-banner" id="updateBanner">
  <span>Nuova versione disponibile</span>
  <button onclick="location.reload()">Aggiorna</button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/config.js"></script>
<script src="js/tournament.js"></script>
<script src="js/league.js"></script>
<script src="js/sync.js"></script>
<script src="js/league-ui.js"></script>
<script src="js/live.js"></script>
<script src="js/admin.js"></script>
<script src="js/main.js"></script>
</body>
</html>
